<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>悬浮助手</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        background: transparent;
        overflow: hidden;
        user-select: none;
        font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
      }
      #panel {
        height: 100vh;
        display: flex;
        flex-direction: column;
        background: rgba(255, 255, 255, 0.97);
        border: 1px solid #a7f3d0;
        border-radius: 12px;
        box-shadow: 0 6px 24px rgba(6, 95, 70, 0.3);
        overflow: hidden;
      }
      /* 标题栏：拖动区域 */
      #header {
        height: 36px;
        flex-shrink: 0;
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 0 8px;
        background: linear-gradient(90deg, #059669, #10b981);
        cursor: move;
      }
      #go {
        border: none;
        background: transparent;
        font-size: 17px;
        cursor: pointer;
        padding: 2px 4px;
        border-radius: 6px;
      }
      #go:hover { background: rgba(255,255,255,0.25); }
      #title {
        flex: 1;
        color: #fff;
        font-size: 12.5px;
        font-weight: 600;
        letter-spacing: 1px;
        white-space: nowrap;
        overflow: hidden;
      }
      #hide {
        width: 22px; height: 22px;
        border: none; border-radius: 6px;
        background: rgba(255,255,255,0.18);
        color: #fff; font-size: 12px;
        cursor: pointer;
      }
      #hide:hover { background: #ef4444; }
      /* 回答显示区（流式输出） */
      #answer {
        flex: 1;
        margin: 8px 10px 0;
        padding: 8px 10px;
        background: #f0fdf4;
        border: 1px solid #d1fae5;
        border-radius: 8px;
        font-size: 12.5px;
        line-height: 1.7;
        color: #1f2937;
        overflow-y: auto;
        white-space: pre-wrap;
        word-break: break-word;
        user-select: text;
        min-height: 60px;
      }
      #answer:empty::before { content: '回答会显示在这里…'; color: #9ca3af; }
      /* 输入区 */
      #input {
        flex-shrink: 0;
        height: 54px;
        margin: 8px 10px 0;
        padding: 8px 10px;
        border: 1px solid #d1d5db;
        border-radius: 8px;
        font-size: 13px;
        font-family: inherit;
        line-height: 1.5;
        resize: none;
        outline: none;
        user-select: text;
      }
      #input:focus { border-color: #10b981; box-shadow: 0 0 0 3px rgba(16,185,129,0.15); }
      /* 底部按钮行 */
      #row {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 6px 10px;
      }
      .btn {
        border: none;
        border-radius: 8px;
        cursor: pointer;
        font-family: inherit;
      }
      #mic {
        padding: 8px 10px;
        background: #ecfdf5;
        border: 1px solid #10b981;
        color: #059669;
        font-size: 13px;
      }
      #mic:hover { background: #d1fae5; }
      #mic.listening { background: #fee2e2; border-color: #ef4444; color: #ef4444; animation: pulse 1.2s infinite; }
      @keyframes pulse { 50% { opacity: 0.6; } }
      #send {
        flex: 1;
        padding: 9px;
        background: #059669;
        color: #fff;
        font-size: 14px;
        font-weight: 700;
      }
      #send:hover { background: #047857; }
      #send:disabled { background: #9ca3af; cursor: default; }
      #open {
        padding: 8px 12px;
        border: 1px solid #10b981;
        background: #fff;
        color: #059669;
        font-size: 12px;
        white-space: nowrap;
      }
      #open:hover { background: #ecfdf5; }
      #status {
        padding: 0 10px 8px;
        font-size: 11px;
        color: #6b7280;
        min-height: 16px;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div id="panel">
      <div id="header" title="按住拖动 · 点击叶子打开主窗口">
        <button id="go" class="btn" title="打开主窗口">🌱</button>
        <span id="title">智慧AI课堂助手</span>
        <button id="hide" class="btn" title="隐藏悬浮面板（主窗口标题栏 🌱 可重新打开）">✕</button>
      </div>
      <div id="answer"></div>
      <textarea id="input" placeholder="输入问题，一键发送给 DeepSeek…"></textarea>
      <div id="row">
        <button id="mic" class="btn" title="语音输入">🎤</button>
        <button id="send" class="btn">🚀 一键发送</button>
        <button id="open" class="btn" title="打开主窗口使用 Prompt 模板和二维码">主窗口</button>
      </div>
      <div id="status"></div>
    </div>

    <script>
      // 不使用 -webkit-app-region（它会吞掉点击事件），手动拖动 + IPC 移动窗口
      const header = document.getElementById('header');
      const input = document.getElementById('input');
      const sendBtn = document.getElementById('send');
      const micBtn = document.getElementById('mic');
      const statusEl = document.getElementById('status');
      const answerBox = document.getElementById('answer');
      const hideBtn = document.getElementById('hide');

      const setStatus = (t) => { statusEl.textContent = t; };

      // ---------- 拖动（标题栏） ----------
      let dragging = false;
      let moved = false;
      let startX = 0;
      let startY = 0;

      header.addEventListener('mousedown', (e) => {
        if (e.target === hideBtn || e.target === document.getElementById('go')) return;
        dragging = true;
        moved = false;
        startX = e.screenX;
        startY = e.screenY;
        window.api.floatDragStart(e.screenX, e.screenY);
      });

      window.addEventListener('mousemove', (e) => {
        if (!dragging) return;
        if (Math.abs(e.screenX - startX) > 3 || Math.abs(e.screenY - startY) > 3) {
          moved = true;
        }
        window.api.floatDragMove(e.screenX, e.screenY);
      });

      window.addEventListener('mouseup', () => {
        if (!dragging) return;
        dragging = false;
        window.api.floatDragEnd();
        if (!moved) window.api.showMainWindow();
      });

      document.getElementById('go').addEventListener('click', () => window.api.showMainWindow());
      document.getElementById('open').addEventListener('click', () => window.api.showMainWindow());
      hideBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        window.api.hideFloating();
      });

      // ---------- 回答流式显示 ----------
      // 轮询读取 DeepSeek 页面最新回答；文本连续 3 次不变视为回答完成
      let pollTimer = null;
      function startPolling() {
        stopPolling();
        let last = '';
        let stable = 0;
        let started = false;
        answerBox.textContent = '';
        setStatus('等待 DeepSeek 回答…');
        const tick = async () => {
          if (pollTimer === null) return;
          try {
            const r = await window.api.pollDeepSeekAnswer();
            if (r && r.ok && r.text && r.text.trim()) {
              const t = r.text.trim();
              if (t === last) {
                stable++;
              } else {
                stable = 0;
                started = true;
                last = t;
                answerBox.textContent = t;
                answerBox.scrollTop = answerBox.scrollHeight;
                setStatus('正在回答…');
              }
              if (started && stable >= 3) {
                setStatus('✓ 回答完成（完整回答见 DeepSeek 页面）');
                pollTimer = null;
                return;
              }
            }
          } catch (e) { /* 忽略单次轮询失败 */ }
          pollTimer = setTimeout(tick, 600);
        };
        pollTimer = setTimeout(tick, 800);
      }
      function stopPolling() {
        if (pollTimer) { clearTimeout(pollTimer); pollTimer = null; }
      }

      // ---------- 语音输入 ----------
      let rec = null;
      let listening = false;
      micBtn.addEventListener('click', () => {
        if (listening) { rec && rec.stop(); return; }
        const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SR) {
          setStatus('当前环境不支持语音识别，可用系统语音输入（Win+H）');
          return;
        }
        rec = new SR();
        rec.lang = 'zh-CN';
        rec.interimResults = true;
        rec.continuous = false;
        rec.onresult = (e) => {
          let t = '';
          for (const r of e.results) t += r[0].transcript;
          input.value = t;
        };
        rec.onend = () => { listening = false; micBtn.classList.remove('listening'); };
        rec.onerror = (e) => {
          listening = false;
          micBtn.classList.remove('listening');
          setStatus('语音识别不可用（' + (e.error || '未知') + '），可用系统语音输入（Win+H）');
        };
        try {
          rec.start();
          listening = true;
          micBtn.classList.add('listening');
          setStatus('正在聆听，请说话…');
        } catch (err) {
          setStatus('语音启动失败，可用系统语音输入（Win+H）');
        }
      });

      // ---------- 一键发送 ----------
      sendBtn.addEventListener('click', async () => {
        const text = input.value.trim();
        if (!text) { setStatus('请先输入问题'); return; }
        sendBtn.disabled = true;
        setStatus('发送中…');
        window.api.showMainWindow(); // 让老师看到 DeepSeek 的回答
        try {
          const res = await window.api.sendToDeepSeek(text);
          if (res && res.ok) {
            input.value = ''; // 发送成功，输入框文字直接消失
            setStatus('已发送');
            startPolling();   // 开始流式显示回答
          } else if (res && res.reason === 'filled') {
            setStatus('已填入输入框，请按回车发送');
          } else {
            await window.api.copyPrompt(text); // 兜底：复制到剪贴板手动粘贴
            setStatus('自动发送失败，已复制，请在主窗口 Ctrl+V 粘贴');
          }
        } catch (err) {
          setStatus('发送出错：' + (err && err.message ? err.message : '未知错误'));
        }
        sendBtn.disabled = false;
      });

      // Ctrl+Enter 快捷发送
      input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
          e.preventDefault();
          sendBtn.click();
        }
      });
    </script>
  </body>
</html>
